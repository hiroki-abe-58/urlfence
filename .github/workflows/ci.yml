name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before anything runs Lake (a lakefile is code): the build configuration must match its pins.
      - name: Pinned build configuration
        run: ./scripts/audit.sh --pins
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
      - name: Proof audit (pins, forbidden keywords, imports, axioms, published statements and their definitions, leanchecker)
        run: ./scripts/audit.sh
      - name: Registry tables equal the IANA files in data/
        run: python3 scripts/check_registry.py
      - name: Tests (CLI cases; WHATWG differential with the runner's node; addresses against inet_pton, ipaddress and is_global; guarded_fetch)
        run: python3 -m unittest discover -s tests -v
      - name: Client compatibility (self-test, then a fixed subset; parsers, requests through a local proxy fixture, direct connections to a local fixture)
        run: |
          python3 tests/compat.py --self-test
          python3 tests/compat.py --quick --strict --require whatwg,node,urlsplit,urllib.request,curl
      - name: Mutation check (every planted bug must be caught)
        run: python3 tests/mutants.py
